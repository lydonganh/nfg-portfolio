<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nguyễn Văn A · SAP S/4HANA Consultant</title>
<meta name="description" content="Portfolio của Nguyễn Văn A, SAP S/4HANA Consultant: dự án, năng lực và kiến thức chia sẻ.">
<meta property="og:title" content="Nguyễn Văn A · SAP S/4HANA Consultant">
<meta property="og:description" content="Dự án, năng lực và kiến thức chia sẻ về SAP S/4HANA Cloud.">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#f5f6f7; --surface:#fff; --surface-2:#f2f4f6; --line:#e1e5ea; --line-2:#cfd6dd;
  --ink:#1d2d3e; --muted:#5b6f84; --faint:#8396a8;
  --brand:#0070f2; --brand-deep:#0a4bb5; --brand-soft:#e8f1fe; --glow:#d7e8ff;
  --qm:#0070f2; --pp:#7a5af8; --ewm:#0f8a8f; --mm:#c35500; --gen:#475e75;
  --positive:#256f3a; --positive-soft:#e6f4ea; --critical:#e76500;
  --sh-1:0 0 0 1px rgba(29,45,62,.05),0 1px 2px rgba(29,45,62,.06);
  --sh-2:0 0 0 1px rgba(29,45,62,.05),0 10px 30px -12px rgba(16,40,80,.22);
  --r-lg:20px; --r-md:14px; --r-sm:8px;
  --font:"72","72full","Segoe UI Variable Text","Segoe UI",system-ui,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --surface:#18202a; --surface-2:#1f2935; --line:#2a3644; --line-2:#364555;
    --ink:#e9edf1; --muted:#a6b3c1; --faint:#7d8c9b;
    --brand:#4db1ff; --brand-deep:#8cccff; --brand-soft:#16304a; --glow:#12304f;
    --qm:#4db1ff; --pp:#a893ff; --ewm:#3cc6c9; --mm:#ff9a4d; --gen:#9fb2c6;
    --positive:#5dc27a; --positive-soft:#15311f;
    --sh-1:0 0 0 1px rgba(255,255,255,.05); --sh-2:0 0 0 1px rgba(255,255,255,.06),0 12px 30px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --surface-2:#1f2935; --line:#2a3644; --line-2:#364555;
  --ink:#e9edf1; --muted:#a6b3c1; --faint:#7d8c9b;
  --brand:#4db1ff; --brand-deep:#8cccff; --brand-soft:#16304a; --glow:#12304f;
  --qm:#4db1ff; --pp:#a893ff; --ewm:#3cc6c9; --mm:#ff9a4d; --gen:#9fb2c6;
  --positive:#5dc27a; --positive-soft:#15311f;
  --sh-1:0 0 0 1px rgba(255,255,255,.05); --sh-2:0 0 0 1px rgba(255,255,255,.06),0 12px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
img{max-width:100%}
h1,h2,h3{margin:0;line-height:1.2}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Shell ---------- */
.shell{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line)}
.shell-row{max-width:1240px;margin:0 auto;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);white-space:nowrap}
.mono{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.brand b{font-size:15px}
.brand small{display:block;font-size:11.5px;color:var(--muted);line-height:1.1}
.search{flex:1;max-width:460px;margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;
  background:var(--surface-2);border:1px solid transparent;color:var(--muted)}
.search:focus-within{border-color:var(--brand);background:var(--surface)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);outline:none}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.demo{font-size:11.5px;font-weight:600;color:var(--critical);border:1px solid currentColor;border-radius:10px;padding:1px 8px;white-space:nowrap}
.tabs{max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 12px 11px;text-decoration:none;color:var(--muted);font-size:14px;white-space:nowrap;position:relative}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--brand);font-weight:600}
.tabs a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--brand)}

main{max-width:1240px;margin:0 auto;padding:0 20px 56px}
.backdrop{position:absolute;inset:0 0 auto 0;height:560px;z-index:-1;
  background:radial-gradient(900px 420px at 78% 0%,var(--glow),transparent 70%),radial-gradient(700px 360px at 5% 10%,var(--brand-soft),transparent 70%)}

/* ---------- Buttons & chips ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:10px;font-weight:600;font-size:14px;
  text-decoration:none;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
:root[data-theme="dark"] .btn{color:#0b1a2a}
.btn.ghost{background:var(--surface);color:var(--brand);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--brand);background:var(--brand-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12.5px;font-weight:600;
  background:var(--surface-2);color:var(--muted);text-decoration:none;white-space:nowrap}
.chip.m{background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
.chip.sample{background:#fff1e0;color:#8a4b00}

/* ---------- Hero ---------- */
.hero>*{min-width:0}
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:56px 0 40px}
.status{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:14px;background:var(--positive-soft);color:var(--positive);font-size:13px;font-weight:600}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 20%,transparent)}
.hero h1{font-size:clamp(36px,5vw,56px);font-weight:700;letter-spacing:-.025em;margin:18px 0 8px}
.hero .role{font-size:clamp(17px,2vw,20px);color:var(--brand-deep);font-weight:600;margin:0}
.hero .lead{font-size:17px;color:var(--muted);max-width:52ch;margin:16px 0 0}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:22px;color:var(--muted);font-size:14px}
.meta span{display:inline-flex;align-items:center;gap:7px}
.meta svg.i{width:16px;height:16px}

/* "My Home" launchpad preview */
.pad{position:relative;padding:18px;border-radius:24px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line);
  box-shadow:var(--sh-2);backdrop-filter:blur(6px)}
.pad-top{display:flex;align-items:center;gap:10px;margin:2px 4px 14px}
.pad-top .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden}
.pad-top .av img{width:100%;height:100%;object-fit:cover}
.pad-top b{display:block;font-size:14px}
.pad-top small{color:var(--muted);font-size:12px}
.pad-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{padding:14px 16px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--sh-1);min-height:128px;display:flex;flex-direction:column}
.kpi .k-t{font-size:13px;font-weight:600}
.kpi .k-s{font-size:12px;color:var(--muted)}
.kpi .k-v{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.kpi .num{font-size:38px;font-weight:300;line-height:1;letter-spacing:-.02em}
.kpi .num small{font-size:13px;color:var(--muted);margin-left:3px;font-weight:400}
.kpi svg.chart{width:78px;height:40px}
.kpi.wide{grid-column:1/-1;min-height:auto}
.mods{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:12px 0 8px;gap:2px}
.mods span{display:block;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px}

/* ---------- Sections ---------- */
.sec{margin-top:64px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
.sec-head h2{font-size:26px;letter-spacing:-.015em}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.sec-head a{font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}

/* Skills */
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.skill{position:relative;padding:22px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);overflow:hidden}
.skill::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.skill .badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:15px;
  background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
.skill h3{font-size:18px;margin:16px 0 4px}
.skill .sub{color:var(--muted);font-size:13.5px;margin:0}
.skill ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px;font-size:14px}
.skill li{display:flex;gap:8px}
.skill li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--c);margin-top:8px}
.skill .apps-l{font-size:12px;color:var(--faint);margin-bottom:6px}

/* SAP Activate */
.activate{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);overflow:hidden}
.phase{padding:18px 16px 20px;border-left:1px solid var(--line);position:relative}
.phase:first-child{border-left:0}
.phase .no{font-size:12px;font-weight:700;color:var(--faint)}
.phase h3{font-size:15px;margin:6px 0 6px}
.phase p{margin:0;font-size:13px;color:var(--muted)}
.phase.on{background:linear-gradient(180deg,var(--brand-soft),transparent 90%)}
.phase.on .no{color:var(--brand)}
.phase.on::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--brand)}

/* Cases */
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.case{display:flex;flex-direction:column;padding:24px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);
  text-decoration:none;color:var(--ink);transition:box-shadow .15s,transform .15s}
.case:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.case-top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.case .client{font-size:13px;color:var(--muted)}
.case h3{font-size:20px;letter-spacing:-.01em;margin:6px 0 10px}
.case .sum{margin:0;color:var(--muted)}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.results div{padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.results b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em}
.results span{font-size:12px;color:var(--muted)}
.case-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.case-foot .go{color:var(--brand);font-weight:600;display:inline-flex;align-items:center;gap:4px}

/* Content cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);overflow:hidden;
  text-decoration:none;color:var(--ink);transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.thumb{position:relative;aspect-ratio:16/9;background:color-mix(in srgb,var(--c) 10%,var(--surface-2));overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.faux{position:absolute;left:12%;right:12%;top:16%;bottom:-8%;border-radius:10px 10px 0 0;background:var(--surface);box-shadow:var(--sh-2);padding:10px}
.faux .bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--c) 70%,transparent);width:34%;margin-bottom:10px}
.faux .ln{height:6px;border-radius:3px;background:var(--line);margin-bottom:6px}
.faux .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.faux .row span{height:26px;border-radius:6px;background:var(--surface-2)}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;backdrop-filter:blur(2px)}
.play svg.i{width:22px;height:22px;fill:#fff;stroke:none}
.dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:2px 7px;border-radius:5px}
.kind{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;box-shadow:var(--sh-1)}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:16px}
.card .sum{margin:0;color:var(--muted);font-size:14px}
.card .meta2{margin-top:auto;padding-top:6px;color:var(--faint);font-size:12.5px}

/* Contact */
.contact>*,.clist>div>div{min-width:0}
.clist a,.clist b{overflow-wrap:anywhere}
.contact{margin-top:72px;display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:40px;border-radius:28px;
  background:radial-gradient(600px 300px at 100% 0%,rgba(255,255,255,.18),transparent 60%),linear-gradient(135deg,#0070f2,#0a3f9e);color:#fff}
.contact h2{font-size:30px;letter-spacing:-.02em}
.contact p{margin:10px 0 0;opacity:.88;max-width:46ch}
.contact .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.contact .btn{background:#fff;color:#0a3f9e;border-color:#fff}
.contact .btn:hover{background:#e8f1fe}
.contact .btn.line{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.contact .btn.line:hover{background:rgba(255,255,255,.12)}
.clist{display:grid;gap:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:8px}
.clist div{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px}
.clist svg.i{opacity:.85}
.clist span{display:block;font-size:12px;opacity:.75}
.clist a,.clist b{color:#fff;font-weight:600;text-decoration:none}
.clist button{margin-left:auto;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:3px 10px;font-size:12.5px;cursor:pointer}

/* ---------- Inner pages ---------- */
.page-head{padding:40px 0 24px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{text-decoration:none}
.page-head h1{font-size:clamp(28px,3.4vw,38px);letter-spacing:-.02em}
.page-head .lead{margin:10px 0 0;color:var(--muted);max-width:62ch;font-size:16px}
.attrs{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.attrs div{padding:10px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--sh-1);font-size:14px;font-weight:600}
.attrs span{display:block;font-size:12px;color:var(--muted);font-weight:400}
.filterbar{display:flex;flex-wrap:wrap;gap:14px;align-items:end;padding:16px 18px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--sh-1);margin-bottom:20px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:170px}
.fld label{font-size:12.5px;color:var(--muted)}
.fld select{height:38px;padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit}
.count{margin-left:auto;color:var(--muted);font-size:13px;align-self:center}
.body-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding:28px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1)}
.body-grid.single{grid-template-columns:minmax(0,1fr)}
.toc{position:sticky;top:120px;align-self:start;font-size:14px}
.toc b{display:block;font-size:12.5px;color:var(--faint);margin-bottom:8px;font-weight:600}
.toc a{display:block;padding:6px 12px;border-left:2px solid var(--line);text-decoration:none;color:var(--muted)}
.toc a:hover{color:var(--brand);border-left-color:var(--brand)}
.prose{max-width:74ch}
.prose h2{font-size:19px;margin:30px 0 10px;letter-spacing:-.01em}
.prose h2:first-child{margin-top:0}
.prose p{margin:0 0 12px}
.bul{margin:0 0 12px;padding-left:20px}
.bul li{margin-bottom:6px}
.video{aspect-ratio:16/9;border-radius:var(--r-md);overflow:hidden;background:#000;margin-bottom:20px}
.video iframe{width:100%;height:100%;border:0}
.video.none{display:grid;place-items:center;background:var(--surface-2);color:var(--muted);text-align:center;padding:16px}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:18px 0;border-top:1px solid var(--line)}
.step-no{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.step p{margin:4px 0 12px}
.shot{display:block;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;max-width:100%}
.shot.ph{display:grid;place-items:center;aspect-ratio:16/7;background:var(--surface-2);color:var(--faint);cursor:default;font-size:13px;border-style:dashed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.timeline{list-style:none;margin:0 0 12px;padding:0}
.timeline li{position:relative;padding:0 0 24px 30px;border-left:2px solid var(--line);margin-left:8px}
.timeline li::before{content:"";position:absolute;left:-8px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--brand)}
.timeline li:last-child{border-left-color:transparent;padding-bottom:4px}
.timeline .when{font-size:13px;color:var(--muted)}
.timeline h3{font-size:16px;margin:3px 0 6px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface-2)}
.about-top{display:flex;gap:24px;align-items:center}
.photo{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;object-fit:cover;flex:none;box-shadow:0 0 0 6px var(--brand-soft)}
.empty{padding:48px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1)}

footer{max-width:1240px;margin:0 auto;padding:24px 20px 36px;color:var(--faint);font-size:12.5px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

#zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:60}

@media (max-width:980px){
  .hero{grid-template-columns:1fr;padding-top:36px}
  .skills{grid-template-columns:1fr}
  .activate{grid-template-columns:repeat(3,1fr)}
  .phase:nth-child(4){border-left:0}
  .phase:nth-child(n+4){border-top:1px solid var(--line)}
  .cases{grid-template-columns:1fr}
  .contact{grid-template-columns:1fr;padding:24px 18px}
  .contact h2{font-size:24px}
  .body-grid{grid-template-columns:1fr;padding:20px}
  .toc{position:static}
}
@media (max-width:620px){
  .brand small,.brand b,.demo{display:none}
  .search{max-width:none;min-width:0}
  .shell-row{padding:0 12px;gap:8px}
  main{padding:0 14px 48px}
  .pad-grid{gap:8px}
  .kpi .num{font-size:30px}
  .activate{grid-template-columns:1fr 1fr}
  .phase:nth-child(odd){border-left:0}
  .phase:nth-child(4){border-left:1px solid var(--line)}
  .phase:nth-child(n+3){border-top:1px solid var(--line)}
  .results{grid-template-columns:1fr 1fr 1fr}
  .results b{font-size:18px}
  .sec-head{flex-direction:column;align-items:start}
  .about-top{flex-direction:column;align-items:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.case:hover,.card:hover{transform:none}}
@media print{
  .shell,.toc,.actions,footer,.filterbar,.backdrop{display:none!important}
  body{background:#fff;color:#000}
  .body-grid{box-shadow:none;padding:0;grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="shell">
  <div class="shell-row">
    <a class="brand" href="#/"><span class="mono" data-initials></span><span><b data-name></b><small>SAP Consultant</small></span></a>
    <span class="demo" id="demoFlag" hidden>Bản demo · nội dung mẫu</span>
    <form class="search" role="search" id="searchForm">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Tìm dự án, video, bài hướng dẫn…" aria-label="Tìm kiếm">
    </form>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Đổi giao diện sáng/tối">
      <svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Điều hướng chính">
    <a href="#/">Trang chủ</a>
    <a href="#/projects">Dự án</a>
    <a href="#/share">Kiến thức chia sẻ</a>
    <a href="#/tools">Công cụ</a>
    <a href="#/about">Giới thiệu</a>
    <a href="#/contact">Liên hệ</a>
  </nav>
</header>

<div class="backdrop" aria-hidden="true"></div>
<main id="app" tabindex="-1"></main>

<footer>
  <span>© <span id="yr"></span> <span data-name></span></span>
  <span>Lấy cảm hứng từ SAP Fiori, không liên kết với SAP SE.</span>
</footer>

<div id="zoom" role="dialog" aria-label="Ảnh phóng to"><img alt=""></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   HỒ SƠ
   demo: true → hiện nhãn "Bản demo · nội dung mẫu" trên thanh trên cùng.
   Toàn bộ nội dung dưới đây là NỘI DUNG MẪU để xem giao diện.
   Thay bằng thông tin thật rồi đặt demo: false trước khi public.
   ===================================================================== */
let PROFILE = null;
const ACTIVATE = [
  { k: "Discover", d: "Tìm hiểu giá trị giải pháp" },
  { k: "Prepare",  d: "Chuẩn bị dự án, nhân sự" },
  { k: "Explore",  d: "Fit-to-standard, chốt thiết kế" },
  { k: "Realize",  d: "Cấu hình, dữ liệu, kiểm thử" },
  { k: "Deploy",   d: "Đào tạo, go-live" },
  { k: "Run",      d: "Vận hành, cải tiến" }
];

/* =====================================================================
   NỘI DUNG — type: "project" | "video" | "guide" | "tool"
   featured: true → hiện ở trang chủ. Tất cả mục dưới đây là mẫu.
   ===================================================================== */
let CONTENT = [];
const MODCOLOR = { QM: "--qm", PP: "--pp", EWM: "--ewm", MM: "--mm" };
const cvar = m => `var(${MODCOLOR[m] || "--gen"})`;
const TYPE = { project: "Dự án", video: "Video", guide: "Bài hướng dẫn", tool: "Công cụ" };
const ICON = {
  project:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12h18"/></svg>',
  guide:'<svg class="i" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg>',
  tool:'<svg class="i" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.5-7.5a4 4 0 0 0-2-2Z"/></svg>',
  play:'<svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
  mail:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  pin:'<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  in:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg>',
  phone:'<svg class="i" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  down:'<svg class="i" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>',
  arrow:'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>'
};

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => { const t = new Date(d); return isNaN(t) ? '' : t.toLocaleDateString('vi-VN'); };
const byDate = (a, b) => String(b.date).localeCompare(String(a.date));
const mchips = arr => (arr || []).map(m => `<span class="chip m" style="--c:${cvar(m)}">${esc(m)}</span>`).join('');
const sampleChip = c => c.sample ? '<span class="chip sample">Dữ liệu mẫu</span>' : '';

/* ---------- Home ---------- */
function viewHome(){
  const counts = {}; CONTENT.forEach(c => (c.module || []).forEach(m => counts[m] = (counts[m] || 0) + 1));
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  const shares = CONTENT.filter(c => c.type === 'video' || c.type === 'guide');
  const bars = [3, 5, 4, 7, 6, 9].map((h, i) => `<rect x="${i * 13}" y="${40 - h * 4}" width="9" height="${h * 4}" rx="2" fill="var(--brand)" opacity="${.35 + i * .12}"/>`).join('');
  const featured = CONTENT.filter(c => c.featured && c.type === 'project').sort(byDate);
  const latest = CONTENT.filter(c => c.featured && (c.type === 'video' || c.type === 'guide')).sort(byDate).slice(0, 3);
  const tools = CONTENT.filter(c => c.type === 'tool');

  return `
  <section class="hero">
    <div>
      ${PROFILE.status ? `<span class="status">${esc(PROFILE.status)}</span>` : ''}
      <h1>${esc(PROFILE.name)}</h1>
      <p class="role">${esc(PROFILE.title)}</p>
      <p class="lead">${esc(PROFILE.headline)}</p>
      <div class="cta">
        <a class="btn" href="#/projects">Xem dự án ${ICON.arrow}</a>
        ${PROFILE.cvUrl ? `<a class="btn ghost" href="${esc(PROFILE.cvUrl)}" target="_blank" rel="noopener">${ICON.down}Tải CV</a>` : ''}
        <a class="btn ghost" href="#/contact">Liên hệ</a>
      </div>
    </div>

    <div class="pad" aria-label="Tóm tắt hồ sơ">
      <div class="pad-top">
        <div class="av">${PROFILE.photo ? `<img src="${esc(PROFILE.photo)}" alt="">` : esc(PROFILE.initials)}</div>
        <div><b>My Home</b><small>${esc(PROFILE.name)}</small></div>
      </div>
      <div class="pad-grid">
        <div class="kpi"><div class="k-t">Kinh nghiệm</div>
          <div class="k-v"><span class="num">${esc(PROFILE.stats.years)}<small>năm</small></span>
          <svg class="chart" viewBox="0 0 78 40" aria-hidden="true">${bars}</svg></div></div>
        <div class="kpi"><div class="k-t">Dự án</div>
          <div class="k-v"><span class="num">${esc(PROFILE.stats.projects)}<small>dự án</small></span>
          <svg class="chart" viewBox="0 0 78 40" aria-hidden="true"><polyline points="0,34 13,30 26,31 39,22 52,18 65,12 78,6" fill="none" stroke="var(--positive)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
        <div class="kpi wide"><div class="k-t">Phân hệ chính</div>
          <div class="mods">${Object.keys(counts).map(m => `<span style="--c:${cvar(m)};flex:${counts[m] / total}"></span>`).join('')}</div>
          <div class="legend">${Object.keys(counts).map(m => `<span><i style="--c:${cvar(m)}"></i>${esc(m)}</span>`).join('')}</div></div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><div><h2>Năng lực</h2></div></div>
    <div class="skills">${PROFILE.skills.map(s => `
      <article class="skill" style="--c:var(${s.color})">
        <div class="badge">${esc(s.module)}</div>
        <h3>${esc(s.name)}</h3>
        <ul>${s.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
      </article>`).join('')}
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><div><h2>Tham gia dự án theo SAP Activate</h2></div></div>
    <div class="activate">${ACTIVATE.map((p, i) => `
      <div class="phase ${PROFILE.activate.includes(p.k) ? 'on' : ''}"><div class="no">Pha ${i + 1}</div><h3 style="margin-bottom:0">${p.k}</h3></div>`).join('')}
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><div><h2>Dự án tiêu biểu</h2></div><a href="#/projects">Tất cả dự án</a></div>
    <div class="cases">${featured.map(caseCard).join('')}</div>
  </section>

  <section class="sec">
    <div class="sec-head"><div><h2>Kiến thức chia sẻ</h2></div><a href="#/share">Xem tất cả</a></div>
    <div class="cards">${latest.map(card).join('')}</div>
  </section>



  ${contactBlock()}`;
}

function caseCard(p){
  return `<a class="case" href="#/item/${esc(p.id)}">
    <div class="case-top"><div class="client">${esc(p.client)}</div><div class="chips">${mchips(p.module)}${sampleChip(p)}</div></div>
    <h3>${esc(p.title)}</h3>
    ${p.results && p.results.length ? `<div class="results">${p.results.map(r => `<div><b>${esc(r.v)}</b><span>${esc(r.l)}</span></div>`).join('')}</div>` : ''}
    <div class="case-foot"><span>${esc(p.role)}, ${esc(p.period)}</span><span class="go">Xem chi tiết ${ICON.arrow}</span></div>
  </a>`;
}

function thumb(c){
  const m = (c.module || [])[0];
  if (c.thumbnail) return `<div class="thumb" style="--c:${cvar(m)}"><img src="${esc(c.thumbnail)}" alt="" loading="lazy">${c.type === 'video' ? `<div class="play"><span>${ICON.play}</span></div>` : ''}${c.duration ? `<span class="dur">${esc(c.duration)}</span>` : ''}</div>`;
  return `<div class="thumb" style="--c:${cvar(m)}">
    <div class="faux"><div class="bar"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:60%"></div><div class="row"><span></span><span></span><span></span></div></div>
    <span class="kind">${TYPE[c.type]}</span>
    ${c.type === 'video' ? `<div class="play"><span>${ICON.play}</span></div>` : ''}
    ${c.duration ? `<span class="dur">${esc(c.duration)}</span>` : ''}
  </div>`;
}

function card(c){
  const isTool = c.type === 'tool' && c.url;
  const href = isTool ? c.url : `#/item/${c.id}`;
  return `<a class="card" href="${esc(href)}"${isTool ? ' target="_blank" rel="noopener"' : ''}>
    ${thumb(c)}
    <div class="card-body">
      <div class="chips">${mchips(c.module)}${sampleChip(c)}</div>
      <h3>${esc(c.title)}</h3>
      <p class="sum">${esc(c.summary)}</p>
    </div>
  </a>`;
}

/* ---------- Lists ---------- */
function viewProjects(){
  const items = CONTENT.filter(c => c.type === 'project').sort(byDate);
  return `<div class="page-head"><h1>Dự án</h1><p class="lead">Các dự án SAP đã tham gia: vai trò, phạm vi và kết quả.</p></div>
    <div class="cases">${items.map(caseCard).join('') || '<div class="empty">Chưa có dự án.</div>'}</div>`;
}

function viewShare(params, only){
  const q = (params.get('q') || '').trim().toLowerCase();
  const kind = only || params.get('type') || '', mod = params.get('module') || '', lvl = params.get('level') || '';
  let items = CONTENT.filter(c => only ? c.type === only : q ? true : (c.type === 'video' || c.type === 'guide'));
  if (kind) items = items.filter(c => c.type === kind);
  if (mod) items = items.filter(c => (c.module || []).includes(mod));
  if (lvl) items = items.filter(c => c.level === lvl);
  if (q) items = items.filter(c => [c.title, c.summary, c.appName, c.client, ...(c.module || [])].join(' ').toLowerCase().includes(q));
  items.sort(byDate);
  const mods = [...new Set(CONTENT.filter(c => c.type === 'video' || c.type === 'guide').flatMap(c => c.module || []))].sort();
  const opt = (vals, v, labels) => ['<option value="">Tất cả</option>', ...vals.map((x, i) => `<option value="${esc(x)}" ${x === v ? 'selected' : ''}>${esc(labels ? labels[i] : x)}</option>`)].join('');
  const title = only === 'tool' ? 'Công cụ' : q ? 'Kết quả tìm kiếm' : 'Kiến thức chia sẻ';
  const lead = only === 'tool' ? 'Tiện ích nhỏ tự làm để hỗ trợ thao tác trên SAP.' : q ? `Từ khoá “${esc(q)}”` : 'Video và bài hướng dẫn thao tác SAP S/4HANA Cloud, có ảnh chụp từng bước.';
  return `<div class="page-head"><h1>${title}</h1><p class="lead">${lead}</p></div>
    ${only || q ? '' : `<div class="filterbar">
      <div class="fld"><label for="fType">Loại</label><select id="fType">${opt(['video', 'guide'], kind, ['Video', 'Bài hướng dẫn'])}</select></div>
      <div class="fld"><label for="fMod">Phân hệ</label><select id="fMod">${opt(mods, mod)}</select></div>
      <div class="fld"><label for="fLvl">Mức độ</label><select id="fLvl">${opt(['Cơ bản', 'Nâng cao'], lvl)}</select></div>
      <span class="count">${items.length} kết quả</span></div>`}
    ${items.length ? `<div class="${items.every(c => c.type === 'project') ? 'cases' : 'cards'}">${items.map(c => c.type === 'project' ? caseCard(c) : card(c)).join('')}</div>`
      : '<div class="empty">Không có nội dung khớp. Bỏ bớt bộ lọc hoặc đổi từ khoá.</div>'}`;
}

/* ---------- Detail ---------- */
function viewItem(id){
  const c = CONTENT.find(x => x.id === id);
  if (!c) return view404();
  const back = c.type === 'project' ? ['projects', 'Dự án'] : c.type === 'tool' ? ['tools', 'Công cụ'] : ['share', 'Kiến thức chia sẻ'];
  const attrs = c.type === 'project'
    ? [['Khách hàng', c.client], ['Vai trò', c.role], ['Thời gian', c.period], ['Hệ thống', c.system]]
    : [['App SAP', c.appName], ['Mức độ', c.level], ['Thời lượng', c.duration], ['Cập nhật', c.date && fmtDate(c.date)]];
  const head = `<div class="page-head">
      <div class="crumbs"><a href="#/">Trang chủ</a> / <a href="#/${back[0]}">${back[1]}</a></div>
      <h1>${esc(c.title)}</h1>
      <p class="lead">${esc(c.summary)}</p>
      <div class="chips" style="margin-top:14px">${mchips(c.module)}${sampleChip(c)}</div>
      <div class="attrs">${attrs.filter(a => a[1]).map(a => `<div><span>${a[0]}</span>${esc(a[1])}</div>`).join('')}</div>
    </div>`;
  const actions = `<div class="actions"><button class="btn ghost" type="button" data-copy>Sao chép link</button>
    ${c.type !== 'video' && c.type !== 'tool' ? '<button class="btn ghost" type="button" data-print>In / Lưu PDF</button>' : ''}</div>`;
  const list = a => `<ul class="bul">${(a || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;

  if (c.type === 'project') return head + `<div class="body-grid">
      <nav class="toc" aria-label="Mục lục"><b>Mục lục</b><a href="#p1" data-anchor>Bối cảnh</a><a href="#p2" data-anchor>Công việc đã làm</a><a href="#p3" data-anchor>Kết quả</a><a href="#p4" data-anchor>App SAP sử dụng</a></nav>
      <div class="prose">
        ${c.results ? `<div class="results" style="margin-top:0">${c.results.map(r => `<div><b>${esc(r.v)}</b><span>${esc(r.l)}</span></div>`).join('')}</div>` : ''}
        <h2 id="p1">Bối cảnh</h2><p>${esc(c.context)}</p>
        <h2 id="p2">Công việc đã làm</h2>${list(c.work)}
        <h2 id="p3">Kết quả</h2>${list(c.outcomes)}
        <h2 id="p4">App SAP sử dụng</h2><div class="chips">${(c.apps || []).map(a => `<span class="chip">${esc(a)}</span>`).join('')}</div>
        ${related(c)}${actions}</div></div>`;

  if (c.type === 'video') return head + `<div class="body-grid single"><div class="prose" style="max-width:none">
      ${c.embedUrl ? `<div class="video"><iframe src="${esc(c.embedUrl)}" title="${esc(c.title)}" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>`
        : '<div class="video none">Chưa có video. Dán link nhúng YouTube/Vimeo vào trường embedUrl.</div>'}
      ${related(c)}${actions}</div></div>`;

  if (c.type === 'guide'){
    const st = c.steps || [];
    return head + `<div class="body-grid">
      <nav class="toc" aria-label="Mục lục"><b>Mục lục</b><a href="#g1" data-anchor>Mục đích</a><a href="#g2" data-anchor>Điều kiện tiên quyết</a>
        ${st.map((s, i) => `<a href="#b${i + 1}" data-anchor>Bước ${i + 1}</a>`).join('')}</nav>
      <div class="prose">
        ${c.scribeUrl ? `<div class="video" style="aspect-ratio:4/3;background:var(--surface-2)"><iframe src="${esc(c.scribeUrl)}" title="${esc(c.title)}" loading="lazy"></iframe></div>` : ''}
        <h2 id="g1">Mục đích</h2><p>${esc(c.purpose)}</p>
        <h2 id="g2">Điều kiện tiên quyết</h2><p>${esc(c.prerequisites)}</p>
        <h2>Các bước thực hiện</h2>
        ${st.map((s, i) => `<div class="step" id="b${i + 1}"><div class="step-no">${i + 1}</div><div><b>Bước ${i + 1}</b><p>${esc(s.text)}</p>
          ${s.image ? `<img class="shot" src="${esc(s.image)}" alt="Bước ${i + 1}" loading="lazy" data-zoom>` : `<div class="shot ph">Chỗ chèn ảnh chụp màn hình bước ${i + 1}</div>`}</div></div>`).join('')}
        ${related(c)}${actions}</div></div>`;
  }
  return head + `<div class="body-grid single"><div class="prose">${c.url ? `<a class="btn" href="${esc(c.url)}" target="_blank" rel="noopener">Mở công cụ ${ICON.arrow}</a>` : ''}</div></div>`;
}

function related(c){
  const r = CONTENT.filter(x => x.id !== c.id && x.type !== 'project' && (x.module || []).some(m => (c.module || []).includes(m))).slice(0, 3);
  return r.length ? `<h2>Nội dung liên quan</h2><div class="cards">${r.map(card).join('')}</div>` : '';
}

/* ---------- About ---------- */
function viewAbout(){
  const P = PROFILE;
  return `<div class="page-head"><div class="about-top">
      ${P.photo ? `<img class="photo" src="${esc(P.photo)}" alt="${esc(P.name)}">` : `<div class="photo">${esc(P.initials)}</div>`}
      <div><h1>${esc(P.name)}</h1><p class="lead" style="margin-top:4px">${esc(P.title)}</p>
      ${P.cvUrl ? `<div class="actions" style="margin-top:14px"><a class="btn" href="${esc(P.cvUrl)}" target="_blank" rel="noopener">${ICON.down}Tải CV</a></div>` : ''}</div>
    </div></div>
    <div class="body-grid">
      <nav class="toc" aria-label="Mục lục"><b>Mục lục</b><a href="#a1" data-anchor>Về tôi</a><a href="#a2" data-anchor>Công việc đảm nhận</a><a href="#a3" data-anchor>Kinh nghiệm</a><a href="#a4" data-anchor>Chứng chỉ</a><a href="#a5" data-anchor>Học vấn</a></nav>
      <div class="prose">
        <h2 id="a1">Về tôi</h2><p>${esc(P.about)}</p>
        <h2 id="a2">Công việc đảm nhận</h2><ul class="bul">${P.services.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
        <h2 id="a3">Kinh nghiệm</h2><ol class="timeline">${P.experience.map(e => `<li><div class="when">${esc(e.period)}</div><h3>${esc(e.role)}, ${esc(e.company)}</h3><p style="margin:0;color:var(--muted)">${esc(e.summary)}</p></li>`).join('')}</ol>
        <h2 id="a4">Chứng chỉ</h2><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Chứng chỉ</th><th>Đơn vị cấp</th><th>Năm</th></tr></thead><tbody>${P.certificates.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.issuer)}</td><td>${esc(c.year)}</td></tr>`).join('')}</tbody></table></div>
        <h2 id="a5">Học vấn</h2>${P.education.map(e => `<p><b>${esc(e.school)}</b><br>${esc(e.degree)}, ${esc(e.year)}</p>`).join('')}
        <p><b>Ngôn ngữ:</b> ${esc(P.languages.join(', '))}</p>
      </div></div>`;
}

/* ---------- Contact ---------- */
function contactBlock(){
  const P = PROFILE;
  return `<section class="contact">
    <div><h2>Cùng trao đổi về dự án SAP của bạn</h2>
            <div class="cta">${P.linkedin ? `<a class="btn line" href="${esc(P.linkedin)}" target="_blank" rel="noopener">Nhắn qua LinkedIn</a>` : ''}</div>
    </div>
    <div class="clist">
      ${P.email ? `<div>${ICON.mail}<div><span>Email</span><a href="mailto:${esc(P.email)}">${esc(P.email)}</a></div><button type="button" data-copy-text="${esc(P.email)}">Sao chép</button></div>` : ''}
    </div>
  </section>`;
}
const viewContact = () => `<div class="page-head"><h1>Liên hệ</h1><p class="lead">Chọn kênh thuận tiện nhất.</p></div>${contactBlock().replace('margin-top:72px', '')}`;
const view404 = () => `<div class="page-head"></div><div class="empty"><h1 style="font-size:24px">Không tìm thấy trang</h1><p>Link này không còn hoặc bị gõ sai.</p><a class="btn" href="#/">Về trang chủ</a></div>`;

/* ---------- Router ---------- */
function parseHash(){
  const [path, qs] = (location.hash.replace(/^#/, '') || '/').split('?');
  return { parts: path.split('/').filter(Boolean), params: new URLSearchParams(qs || '') };
}
function render(){
  if (!PROFILE) return;
  const { parts, params } = parseHash();
  const r = parts[0] || '';
  let html, nav = r;
  if (!r) html = viewHome();
  else if (r === 'projects') html = viewProjects();
  else if (r === 'share') html = viewShare(params);
  else if (r === 'tools') html = viewShare(params, 'tool');
  else if (r === 'search') { html = viewShare(params); nav = ''; }
  else if (r === 'item') { html = viewItem(parts[1]); const c = CONTENT.find(x => x.id === parts[1]); nav = c ? (c.type === 'project' ? 'projects' : c.type === 'tool' ? 'tools' : 'share') : ''; }
  else if (r === 'about') html = viewAbout();
  else if (r === 'contact') html = viewContact();
  else html = view404();
  $app.innerHTML = html;
  document.querySelector('.backdrop').style.display = r ? 'none' : '';
  document.querySelectorAll('#tabs a').forEach(a => a.getAttribute('href') === '#/' + nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  document.getElementById('q').value = params.get('q') || '';
  document.title = (r ? (document.querySelector('.page-head h1')?.textContent || '') + ' · ' : '') + PROFILE.name;
  window.scrollTo(0, 0);
  bind(r, params);
}
function bind(r, params){
  const ids = ['fType', 'fMod', 'fLvl'], keys = ['type', 'module', 'level'];
  ids.forEach(id => { const s = document.getElementById(id); if (s) s.onchange = () => {
    const p = new URLSearchParams(params);
    ids.forEach((x, j) => { const e = document.getElementById(x); e.value ? p.set(keys[j], e.value) : p.delete(keys[j]); });
    location.hash = '#/' + (r || 'share') + (p.toString() ? '?' + p : '');
  }; });
  $app.querySelectorAll('[data-anchor]').forEach(a => a.onclick = e => {
    e.preventDefault();
    document.getElementById(a.getAttribute('href').slice(1))?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
  $app.querySelectorAll('[data-zoom]').forEach(img => img.onclick = () => { zoom.firstChild.src = img.src; zoom.style.display = 'flex'; });
  const copy = (t, ok) => navigator.clipboard ? navigator.clipboard.writeText(t).then(() => toast(ok), () => toast('Không sao chép được. Hãy bôi đen và copy.')) : toast('Trình duyệt không hỗ trợ sao chép tự động.');
  const cp = $app.querySelector('[data-copy]'); if (cp) cp.onclick = () => copy(location.href, 'Đã sao chép link.');
  $app.querySelectorAll('[data-copy-text]').forEach(b => b.onclick = () => copy(b.dataset.copyText, 'Đã sao chép email.'));
  const pr = $app.querySelector('[data-print]'); if (pr) pr.onclick = () => window.print();
}
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2200); }

document.getElementById('searchForm').onsubmit = e => { e.preventDefault(); const v = document.getElementById('q').value.trim(); location.hash = '#/search' + (v ? '?q=' + encodeURIComponent(v) : ''); };
const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.setAttribute('data-theme', t); } catch (e) {}
document.getElementById('themeBtn').onclick = () => {
  const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
};
const zoom = document.getElementById('zoom');
zoom.onclick = () => zoom.style.display = 'none';
document.addEventListener('keydown', e => { if (e.key === 'Escape') zoom.style.display = 'none'; });
document.getElementById('yr').textContent = new Date().getFullYear();
window.addEventListener('hashchange', render);
async function boot(){
  $app.innerHTML = '<div class="empty">Đang tải nội dung…</div>';
  let profile, posts;
  try {
    const [a, b] = await Promise.all([fetch('content/profile.json'), fetch('content/posts.json')]);
    if (!a.ok) throw new Error('Không tải được content/profile.json (HTTP ' + a.status + ')');
    if (!b.ok) throw new Error('Không tải được content/posts.json (HTTP ' + b.status + ')');
    profile = await a.json();
    posts = await b.json();
  } catch (e) {
    $app.innerHTML = '<div class="empty"><h1 style="font-size:24px">Không tải được dữ liệu</h1>'
      + '<p>' + esc(e.message) + '</p>'
      + '<p>Không đọc được <code>content/profile.json</code> hoặc <code>content/posts.json</code>.</p>'
      + '<p>Nếu đang mở file bằng double-click (file:///), trình duyệt chặn fetch. Xem thử bằng: <code>npx serve .</code></p></div>';
    return;
  }
  PROFILE = profile;
  CONTENT = posts.filter(p => p.status !== 'draft');
  document.querySelectorAll('[data-name]').forEach(e => e.textContent = PROFILE.name);
  document.querySelectorAll('[data-initials]').forEach(e => e.textContent = PROFILE.initials);
  document.getElementById('demoFlag').hidden = !PROFILE.demo;
  render();
}
boot();
</script>
</body>
</html>
